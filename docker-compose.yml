services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-code_atlas}
      POSTGRES_USER: ${DB_USER:-code_atlas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - code_atlas_pgdata:/var/lib/postgresql/data
      - ./database/001_stage2.sql:/docker-entrypoint-initdb.d/001_stage2.sql:ro
      - ./database/003_rag_core.sql:/docker-entrypoint-initdb.d/003_rag_core.sql:ro
      - ./database/004_pgvector.sql:/docker-entrypoint-initdb.d/004_pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SERVER_ADDRESS: 0.0.0.0
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-1}
      LLM_INPUT_PRICE: ${LLM_INPUT_PRICE:-}
      LLM_OUTPUT_PRICE: ${LLM_OUTPUT_PRICE:-}
      EMBEDDING_INPUT_PRICE: ${EMBEDDING_INPUT_PRICE:-}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-code_atlas}
      DB_USER: ${DB_USER:-code_atlas}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build: ./frontend
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:80"

volumes:
  code_atlas_pgdata:

